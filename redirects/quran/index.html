<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Abrahamic Books</title>
    <script>
      const destination = new URL("https://abrahamicbooks.org/");
      destination.search = location.search;
      destination.hash = location.hash;
      // Redirect immediately. Old service-worker cleanup is best-effort and
      // must never hold up navigation to the current app.
      if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations()
        .then((registrations) => registrations
          .filter((registration) => new URL(registration.scope).pathname.startsWith("/quran"))
          .forEach((registration) => registration.unregister()))
        .catch(() => {});
      location.replace(destination);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=https://abrahamicbooks.org/"></noscript>
  </head>
  <body>
    <p>Abrahamic Books moved to <a href="https://abrahamicbooks.org/">abrahamicbooks.org</a>.</p>
  </body>
</html>
